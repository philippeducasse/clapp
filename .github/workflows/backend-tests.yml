name: backend tests

on:
  push:
    branches-ignore:
      - production
      - main
    paths:
      - "apps/backend/**"
  pull_request:
    paths:
      - "apps/backend/**"

defaults:
  run:
    working-directory: apps/backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
