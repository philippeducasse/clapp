name: discovery tests

on:
  push:
    branches-ignore:
      - production
    paths:
      - "apps/discovery/**"
  pull_request:
    paths:
      - "apps/discovery/**"

defaults:
  run:
    working-directory: apps/discovery

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uvx ruff check . && uvx ruff format --check .

      - name: Run tests
        run: uv run pytest
